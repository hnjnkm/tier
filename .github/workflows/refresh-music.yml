name: Refresh YouTube Music catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of artists to refresh (0 = all)'
        default: '100'
        required: true
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ytmusic-requirements.txt
      - run: npm ci
      - run: python -m pip install -r scripts/ytmusic-requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - uses: actions/cache@v4
        with:
          path: /tmp/tier-ytmusic-cache
          key: ytmusic-albums-${{ github.run_id }}
          restore-keys: ytmusic-albums-
      - run: node --import tsx scripts/export-music-artists.ts
      - name: Refresh oldest artist catalogs
        env:
          REFRESH_LIMIT: ${{ inputs.limit || '100' }}
        run: python scripts/refresh-music.py --artists /tmp/tier-music-artists.json --limit "$REFRESH_LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-refresh-report
          path: /tmp/tier-ytmusic-refresh-report.json
          if-no-files-found: ignore
      - name: Save refreshed metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/music src/data/youtube-channels.json src/data/music-refresh-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified YouTube Music artist catalogs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - run: npm test
      - run: npm run check:media
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy refreshed music data
        id: deployment
        uses: actions/deploy-pages@v4
