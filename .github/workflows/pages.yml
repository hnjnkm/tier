name: Deploy my tier to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:media
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$SITE_URL" --output "$RUNNER_TEMP/my-tier-site.html"
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const html = await readFile(`${process.env.RUNNER_TEMP}/my-tier-site.html`, 'utf8');
          if (!html.includes('<title>나의 아티스트 티어</title>')) throw new Error('Published page is not the tier app');
          const assets = [...html.matchAll(/(?:src|href)="([^"]+\/assets\/[^"]+)"/g)].map(match => match[1]);
          if (!assets.length) throw new Error('Published page has no app assets');
          for (const asset of assets) {
            const response = await fetch(new URL(asset, process.env.SITE_URL), { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`Published asset failed: ${asset} (${response.status})`);
          }
          const pages = { about: '사이트 소개', guide: '이용 안내', privacy: '개인정보처리방침', terms: '이용약관', contact: '문의' };
          for (const [path, title] of Object.entries(pages)) {
            const response = await fetch(new URL(`${path}/`, process.env.SITE_URL), { signal: AbortSignal.timeout(15000) });
            if (!response.ok || !(await response.text()).includes(`<h1>${title}</h1>`)) throw new Error(`Published information page failed: ${path}`);
          }
          const sitemap = await fetch(new URL('sitemap.xml', process.env.SITE_URL), { signal: AbortSignal.timeout(15000) });
          if (!sitemap.ok || !(await sitemap.text()).includes('/privacy/</loc>')) throw new Error('Published sitemap failed');
          console.log(`Verified public app and ${assets.length} assets at ${process.env.SITE_URL}`);
          JS
